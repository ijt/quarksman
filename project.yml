# Generates Quarksman.xcodeproj for the iOS app: run `xcodegen` after adding or removing source files.
# The macOS app still builds with `swift run` from Package.swift; both use Sources/Quarksman.
name: Quarksman
options:
  bundleIdPrefix: com.issactrotts
  deploymentTarget:
    iOS: "17.0"
targets:
  Quarksman-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Quarksman
        excludes:
          - Resources   # macOS-only (SwiftPM) icon
      - path: iOS/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Quarksman
        PRODUCT_BUNDLE_IDENTIFIER: com.issactrotts.Quarksman
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Feynman
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
